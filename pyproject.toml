[project]
name = "urban-heat"
version = "0.1.0"
description = "Urban heat island analysis and spatiotemporal prediction for Mumbai and Navi Mumbai"
requires-python = ">=3.12,<3.13"
# Technology stack from the SRS (section 2.2). Versions are those installed in .venv.
dependencies = [
    "numpy",
    "pandas",
    "shapely>=2.0",
    "pyproj",
    "geopandas",
    "rasterio",
    "earthengine-api",
    "requests",
    "matplotlib",
    "scikit-learn",
    "torch",
    "streamlit",
    "folium",
    "plotly",
    "jupyter",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/urban_heat"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
