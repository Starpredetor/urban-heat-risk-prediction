[project]
name = "uhrm"
version = "0.1.0"
description = "Urban Heat Risk Mapper - multi-temporal satellite LST forecasting"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "xarray>=2024.6",
    "netcdf4>=1.6",
    "rasterio>=1.3",
    "pystac-client>=0.8",
    "planetary-computer>=1.0",
    "odc-stac>=0.3.10",
    "odc-geo>=0.4.7",
    "pyproj>=3.6",
    "pyyaml>=6.0",
    "torch>=2.5",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uhrm"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]
