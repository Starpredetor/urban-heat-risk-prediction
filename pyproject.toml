[project]
name = "uhrm"
version = "0.1.0"
description = "Urban Heat Risk Mapper - multi-temporal satellite LST forecasting"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.3",
    "xarray==2026.7.0",
    "netcdf4==1.7.4",
    "rasterio==1.5.1",
    "pystac-client==0.9.0",
    "planetary-computer==1.0.0",
    "odc-stac==0.5.3",
    "odc-geo==0.5.3",
    "pyproj==3.8.0",
    "pyyaml==6.0.3",
    "torch>=2.5",
    "matplotlib==3.11.1",
    "pytest==9.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uhrm"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]
