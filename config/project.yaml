# ============================================================
#  UHRM v2 project configuration (SRS v2.1)
#  Study areas, grids and data choices. Where it runs (Colab or
#  offline) is chosen by a mode file in config/modes/.
# ============================================================

# --- Study areas (FR-P1.1) --------------------------------------------------
# Boundary paths are relative to the mode's storage_root.
# Stage A boundaries are provisional (OpenStreetMap); Stage B replaces them
# with authoritative boundaries verified in QGIS (FR-P1.8, OI-1).
study_areas:
  - {name: Mumbai,      slug: mumbai,      boundary: boundaries/mumbai.geojson}
  - {name: Navi Mumbai, slug: navi_mumbai, boundary: boundaries/navi_mumbai.geojson}

# --- Grids (FR-P1.4 to FR-P1.6) ---------------------------------------------
# UTM 43N covers both cities. The model domain is the bounding box of both
# cities plus a buffer, so 64 x 64 patches fit (at 1 km a city is only
# hundreds of cells). City polygons stay the masks for all metrics.
grid:
  crs: EPSG:32643
  model_resolution_m: 1000
  domain_buffer_km: 20        # OI-3: revisit once cell counts are known
  min_cell_overlap: 0.5       # a cell belongs to a city if >= 50% inside its polygon

# --- MODIS MOD11A2 (FR-P2.1, FR-P3.1) ---------------------------------------
modis:
  collection: MODIS/061/MOD11A2     # Earth Engine id; verify at implementation
  start_date: 2001-01-01
  end_date: 2025-12-31              # OI-4: confirm the last complete year
  first_milestone_date: 2024-04-01  # one pre-monsoon date for the first map
  scale: 0.02                       # kelvin per digital number
  qc:
    # QC_Day bits 0-1 = 0 means "LST produced, good quality".
    require_good_mandatory_qa: true
    # QC_Day bits 6-7: 0 <=1 K, 1 <=2 K, 2 <=3 K, 3 >3 K average LST error.
    max_lst_error_class: 1
    # Bits 2-5 are deliberately not used: documentation sources disagree.
    valid_dn_range: [7500, 65535]
    plausible_celsius: [0.0, 75.0]

# --- Other Phase 2 datasets (FR-P2.2 to FR-P2.5) -----------------------------
datasets:
  # MOD09A1: 8-day 500 m surface reflectance, same cadence as MOD11A2. Gives
  # NDVI/NDBI/NDWI for the full 2001-2025 series (resolves OI-2). Fetched raw on
  # a grid refined 2x (500 m) and aggregated to 1 km later with a validity mask.
  reflectance:
    collection: MODIS/061/MOD09A1
    # b01 red, b02 NIR, b04 green, b06 SWIR1; StateQA for cloud screening in Phase 3.
    bands: [sur_refl_b01, sur_refl_b02, sur_refl_b04, sur_refl_b06, StateQA]
    grid_refinement: 2

  # ERA5-Land hourly, averaged per MODIS 8-day window over these UTC hours.
  # Terra passes at 10:30 local solar time (about 05:40 UTC over Mumbai), so
  # hours 5 and 6 bracket the overpass. About 9 km native: regional context only.
  era5_land:
    collection: ECMWF/ERA5_LAND/HOURLY
    bands: [temperature_2m, dewpoint_temperature_2m, u_component_of_wind_10m,
            v_component_of_wind_10m, skin_temperature]
    hours_utc: [5, 6]

  # Land-cover area fractions per 1 km cell (static: 2020 and 2021 releases).
  worldcover:
    versions: {2020: ESA/WorldCover/v100, 2021: ESA/WorldCover/v200}
    classes: [10, 20, 30, 40, 50, 60, 70, 80, 90, 95, 100]

  # Elevation mean and relief (std) per 1 km cell.
  terrain:
    asset: USGS/SRTMGL1_003

# --- Phase 3 preprocessing (FR-P3.1 to FR-P3.6) -------------------------------
preprocess:
  reflectance:
    scale: 0.0001                  # MOD09A1 surface reflectance per DN
    valid_dn_range: [-100, 16000]
    # StateQA: keep cloud state 00 (clear) and no cloud shadow; cirrus class
    # 0 none, 1 small, 2 average, 3 high. Bit 10 is not used (sources disagree).
    max_cirrus_class: 1
    min_clear_subpixels: 2         # of the 4 x 500 m pixels in a 1 km cell
  # A cell counts as water (excluded from validity statistics) above this
  # WorldCover permanent-water fraction.
  max_water_fraction: 0.5
  # A date is usable for model sequences when at least this fraction of land
  # cells has valid LST. Checked against the observed distribution (FR-P3.4).
  min_valid_fraction: 0.3
