# ============================================================
#  Every choice this project makes lives in this one file.
# ============================================================

# --- Which city, and how detailed -------------------------------------------
city: Mumbai
bbox: [72.78, 18.99, 72.97, 19.17]   # left, bottom, right, top (longitude/latitude)
crs: EPSG:32643                      # the map projection for this part of India
resolution: 30                       # each pixel covers 30 x 30 metres

# --- Which images to use ----------------------------------------------------
# 2017 onwards because Sentinel-2 images only exist worldwide from 2017.
start_year: 2017
end_year: 2025
months: [3, 4, 5]                    # March-May: Mumbai's hot, dry, cloud-free season
max_cloud: 20                        # ignore any image more than 20% cloudy
max_images_per_year: 12              # a dozen clear images is plenty to average

# --- How the model learns ---------------------------------------------------
years_in: 4                          # look at 4 past years to predict the next
patch: 64                            # learn from 64 x 64 pixel squares

# The model is TESTED on years it never saw while learning. This is what makes
# the score honest. These three must not overlap, and must be in order.
train_years: [2021, 2022]
val_years:   [2023, 2023]
test_years:  [2024, 2025]

epochs: 40
batch_size: 16
learning_rate: 0.001
seed: 42

out_dir: data
